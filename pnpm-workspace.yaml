packages:
  - 'apps/*'
  - 'packages/*'

# ---------------------------------------------------------------------------
# 为什么用 hoisted 而不是 pnpm 默认的 isolated 布局
#
# 默认布局需要 pnpm 在 node_modules/.pnpm/node_modules/ 下创建大量**目录符号链接**。
# 在本机（Windows）上这一步会被系统拒绝，报 os error 2 / os error 5，而且每次拦下的
# 包都不一样（@types/react-dom、@babel/helpers、convert-source-map …… 每次都换），
# 清空 node_modules、禁用沙箱重试均无效，直接导致 pnpm install 无法完成。
#
# 已排除的原因（都做过定向探测）：
#   - 权限 / 沙箱：junction、文件符号链接、node_modules 下深层建目录全正常
#   - store 损坏：清空 node_modules 后同样复现
#   - 长路径：失败路径约 70 字符，远低于 260
#
# hoisted 是 npm 风格的扁平布局，不创建那层链接，因此不受影响。
# 本项目只有 3 个工作区包、react 单版本，不存在必须靠 isolated 隔离的依赖冲突，
# 代价可以接受。将来若真出现 peer 版本冲突，再回头排查本机的符号链接问题。
#
# 注意：pnpm 12 起配置只读本文件，`~/.npmrc` 与项目 .npmrc 里的同名项会被忽略
# （可用 `pnpm config list` 验证）。
# ---------------------------------------------------------------------------
nodeLinker: hoisted

# pnpm 12 起，依赖的 postinstall 脚本默认被阻止，必须显式放行。
# 不放行的后果不是"少个脚本"，而是 install 直接以 ERR_PNPM_IGNORED_BUILDS 失败（exit 1）。
#   electron —— 靠 postinstall 下载预编译二进制，不放行则 node_modules/electron 里没有 dist
#   esbuild  —— 靠 postinstall 生成平台可执行文件
allowBuilds:
  electron: true
  # electron-builder 的传递依赖（NSIS 安装器差分更新用）。electron-builder 装上后
  # pnpm 12 会要求显式放行，否则 install 以 ERR_PNPM_IGNORED_BUILDS 失败。
  electron-winstaller: true
  esbuild: true

# ---------------------------------------------------------------------------
# ⚠️ TypeScript 并存安排（本步骤实测得出，改动前先读完）
#
# 仓库里同时存在**两个** TypeScript，这是刻意的：
#
#   根 node_modules/typescript        = 6.0.3   ← 供 typescript-eslint 使用
#   apps/desktop、packages/* 各自那份 = 7.0.2   ← 供 tsc 使用（项目锁定版本）
#
# 为什么必须这样：typescript-eslint 8.70 **明确拒绝** TS 7（启动即抛
# "typescript-eslint does not support TS 7.0."，exit 2 —— 报错很响，不是静默降级）。
# 而 TypeScript 官方给了并存方案：让 lint 侧用 TS 6 的 API。
#
# 三个包的 `pnpm typecheck` 走各自 node_modules/.bin/tsc，解析到**自己那份 7.0.2**，
# 所以项目编译版本没有被降级（已实测确认）。
#
# 因此**不要**在这里加 `peerDependencyRules.allowedVersions: typescript-eslint>typescript: 7`
# —— 那会强制根系到 TS 7，lint 立刻整体不可用。
# `peerDependencyRules` 必须写在本文件（pnpm 12 不再读 package.json 的 `pnpm` 字段），
# 但当前用不上它：根 TS 6.0.3 本就落在 typescript-eslint 声明的 peer 区间内。
# ---------------------------------------------------------------------------

# pnpm 的供应链策略默认拒绝"刚发布不久"的版本；electron 需要显式豁免。
minimumReleaseAgeExclude:
  - electron@44.4.2
  - fast-check@4.10.2
