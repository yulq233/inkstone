[build-system]
# 显式声明构建后端：没有这一段时 pip 会回落到 setuptools 的 legacy 后端，
# 而它读不懂下面的 [project] 表，`pip install -e .` 会直接报 fields 缺失。
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstone-sidecar"
version = "0.1.0"
description = "砚台本地服务（Electron 主进程拉起的 sidecar）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    # 模型网关要发 HTTP。**必须在运行时依赖里**，不能只放在 dev 组 ——
    # 打包后的 sidecar 没有 dev 依赖，而 AI 是核心功能（`docs/11` P0）。
    "httpx>=0.27",
    # Codex 条目的 frontmatter 解析（`docs/15` D-1）。同理必须在运行时依赖里：
    # 设定文件读写是 M4-P0 的核心功能。纯 Python 可跑（PyInstaller 会连
    # C 扩展可选件一起分析，我们只用 safe_load/safe_dump，不碰 CLoader）。
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # 网关是 async 的（httpx.AsyncClient）。没有它就只能每个用例包一层
    # `asyncio.run()`，而 P1 的流式生成会用到 async fixture 与异步生成器 ——
    # 那时代替不了，不如现在就把口子开对。
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # pyyaml 的类型桩（mypy strict 下 `import yaml` 缺桩即报错）。
    # 运行时依赖归运行时，类型桩归 dev —— 两个清单都要有，少一边就断。
    "types-PyYAML>=6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# prompt 模板是**数据文件**，不写这一条时 `pip install` 会把它们漏掉 ——
# 症状是"开发机好好的、装完就报模板缺失"，而这要到步骤 07 打包才会暴露。
# 依赖同理：PyInstaller 侧还要 `--add-data`，见 docs/10。
"inkstone.ai.prompts" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# strict：异步用例必须显式打 `@pytest.mark.asyncio` 才跑。
# 写出来是为了防止有人以后切到 auto —— 那会让"忘了加 marker 的同步用例"
# 静默变成异步收集，症状是"测试过了但实际没执行"。
asyncio_mode = "strict"
# 不写这一行时 pytest-asyncio 1.x 会为每个用例发一条 deprecation warning，
# 把真警告淹掉。取值与默认行为一致（每个用例一个事件循环）。
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 与 requires-python 的下限对齐（本机实跑 3.13）—— 取最保守的下限，
# CI 也用 3.12，避免"本地过了、CI 不过"。
python_version = "3.12"
strict = true

# ⚠️ 这一行不能省。缺它时 mypy 只认 alias，会把 `WorkMeta(word_goal=...)` 这种
# **正确写法**报成 "did you mean wordGoal?"，而 camelCase 在 populate_by_name=True
# 下同样能跑 —— 照提示改完测试还是全绿，问题被掩盖到某天关掉 populate_by_name。
# 插件会读 populate_by_name，两种名字都接受。
plugins = ["pydantic.mypy"]

# 测试代码放宽。
#
# 纳入 tests/ 是有意义的：pytest 不会报标注错误，但标注错会误导读代码的人。
# 放宽的这几条都是**pytest 惯用法带来的噪声**，不是真问题：
#  - disallow_any_generics：测试里到处是裸 `dict`（构造请求体、断言响应），
#    逐个补成 `dict[str, Any]` 只增加噪音；
#  - warn_return_any：`response.json()` 就是 Any，测试断言里必然回流；
#  - disallow_incomplete_defs：fixture 常只标一部分参数。
# 保留 strict 的其余部分 —— 真问题（类型不兼容、属性不存在）仍然报。
#
# ⚠️ 这条 `tests.*` 能生效，靠的是 `tests/__init__.py` 的存在。
# 没有那个文件时 `tests/` 不是包，mypy 眼里的模块名是顶层的 `test_recent`，
# 本段 overrides **静默失效**（配置看着没问题，错误一条不减 —— 本步骤实测踩到）。
# 而 mypy 的 module 模式只允许整段 `*` 或 `.*`，写不了 `test_*` 这种半通配。
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
disallow_any_expr = false
