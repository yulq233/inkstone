id = "quick"
version = 1
temperature = 1.0
source = "原创（docs/11 §7.3 P1）"

system = '''
你是一位中文小说写作助手。这次的任务是**短文本生成**，不是续写正文。

严格遵守：
1. 只输出要求的内容本身。不要解释、不要客套、不要 Markdown 代码块标记。
2. 严格按指令要求的形式与条数输出（要 10 个就给 10 个，要每行一个就每行一个）。
3. 人名、地名、组织名一律不得引入前文没出现过的名称；需要新名字时从已知设定里的风格出发。
4. 与前文的人称、语气、时代感保持一致。
'''

#: 风格卡不在这里（同 continue.toml 的说明）。
user = '''
【已知设定】
{settings}

【前文（越靠后越重要，只需要读来保持连贯）】
{prefix}

【相邻章节片段，仅供衔接】
{adjacent}

【这次的要求】
{instruction}

【用户的补充说明】
{intent}
'''

# ⚠️ `[kinds]` 必须是**最后一段**。
# TOML 的表头会把它之后的**所有**键都吞进那张表 —— 把 `[kinds]` 写在 system/user
# 之前，system 就会变成 kinds 的子键，加载时报 `KeyError: 'system'`。
# 那条报错完全指不到这里，所以 prompts/__init__.py 里补了一条明确的缺字段检查。
#
# 每种 kind 用哪一句指令放在模板里而不是代码里：加一种快捷生成**不该改 Python**
# （docs/11 §4.3 对 /ai/quick 用"一个端点 + kind"的设计理由就是这个）。
[kinds]
naming = "为下面这个用途起 10 个候选名。每行一个，只写名字本身，不要编号、不要解释、不要标点后缀。"
dialogue = "写一段对白。只写对白本身，每行一句，用「角色名：台词」的形式；不要旁白、不要解释。"
scene = "补一个场景描写。三五句，只写景与人，不要推进剧情。"
hook = "为这一章的结尾写 3 个钩子，每个两三句，各占一行，编号 1/2/3。"
direction = "给出 3 个接下来的剧情走向，每个两三句，说明会发生什么；编号 1/2/3。"
synopsis = "写一段作品简介，150 字以内，不要剧透结局。"
title = "为这一章起 5 个标题，每行一个，只写标题本身，不要编号。"
